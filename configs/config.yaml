wandb:
  enabled: true
  project: "bccd-t2-ak"
  entity: "t2-ak-tec"
  run_name: "ann-epoch-metrics-curves"

detection:
  # Pesos de inicio para fine-tuning (YOLO26s preentrenado en COCO).
  weights: "yolo26s.pt"

  # Ruta al data.yaml generado por Roboflow para BCCD.
  data_yaml: "data/bccd/data.yaml"

  # Pesos del mejor modelo tras el entrenamiento (para inferencia).
  best_weights: "runs/detect/outputs/yolo_finetune/weights/best.pt"

  # Directorio donde YOLO guarda experimentos.
  output_dir: "outputs"

  # Hiperparámetros de entrenamiento.
  epochs: 15
  imgsz: 320
  batch: 4
  lr0: 0.01

  # Hiperparámetros de inferencia.
  conf_threshold: 0.25
  iou_threshold: 0.45

  # Tamaño uniforme de cada recorte celular (requerido por NFR-6a).
  crop_width: 224
  crop_height: 224

seed: 42

dataset:
  train_dir: "data/bccd/train"
  val_dir: "data/bccd/valid"
  test_dir: "data/bccd/test"
  class_names: ["Platelets", "RBC", "WBC"]
  batch_size: 32

outputs:
  runs_dir: "outputs/runs"

augmentation:
  # Geometric (aggressive)
  horizontal_flip_p: 0.5
  vertical_flip_p: 0.5
  rotation_degrees: 180
  translate_x: 0.1
  translate_y: 0.1
  scale_min: 0.9
  scale_max: 1.1

  # Photometric (conservative - preserves Giemsa/Wright staining)
  brightness: 0.2
  contrast: 0.2
  saturation: 0.1
  hue: 0.05        # max posible es 0.5, usamos 0.05

  # Noise
  blur_kernel_size: 3
  blur_sigma: [0.1, 0.5]

  # Normalization (ImageNet stats)
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

extractor:
  truncate_at: "layer3"   # layer2=128, layer3=256, layer4=512 dims
  projection_dim: null    # null = sin proyección, int = activa FR-7

feature_pipeline:
  normalization_enabled: true
  dimensionality_strategy: "none"

ann:
  hidden_dims: [128, 64]
  dropout: 0.6
  lr: 0.0003
  weight_decay: 0.001
  num_classes: 3
  epochs: 10

svm:
  kernel: "linear"
  C: 0.1
  gamma: "scale"
  c_values: [0.1, 1.0, 10.0]
  gamma_values: ["scale", 0.1, 1.0]

inference:
  alpha: 0.05
  min_cells_for_test: 5
  min_expected_count: 1.0
  test_type: "chi_square"
