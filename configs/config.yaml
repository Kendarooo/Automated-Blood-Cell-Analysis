wandb:
  project: "bccd-hemograma"
  entity: null          # Tu usuario o equipo en W&B. null = cuenta personal.
  run_name: "yolo-finetune-v1"

detection:
  # Pesos de inicio para fine-tuning (YOLO12s preentrenado en COCO).
  weights: "yolo12s.pt"

  # Ruta al data.yaml generado por Roboflow para BCCD.
  data_yaml: "data/BCCD/data.yaml"

  # Pesos del mejor modelo tras el entrenamiento (para inferencia).
  best_weights: "outputs/yolo_finetune/weights/best.pt"

  # Directorio donde YOLO guarda experimentos.
  output_dir: "outputs"

  # Hiperparámetros de entrenamiento.
  epochs: 50
  imgsz: 640
  batch: 16
  lr0: 0.01

  # Hiperparámetros de inferencia.
  conf_threshold: 0.25
  iou_threshold: 0.45

  # Tamaño uniforme de cada recorte celular (requerido por NFR-6a).
  crop_width: 224
  crop_height: 224

seed: 42

augmentation:
  # Geometric (aggressive)
  horizontal_flip_p: 0.5
  vertical_flip_p: 0.5
  rotation_degrees: 180
  translate_x: 0.1
  translate_y: 0.1
  scale_min: 0.9
  scale_max: 1.1

  # Photometric (conservative - preserves Giemsa/Wright staining)
  brightness: 0.2
  contrast: 0.2
  saturation: 0.1
  hue: 0.05        # max posible es 0.5, usamos 0.05

  # Noise
  blur_kernel_size: 3
  blur_sigma: [0.1, 0.5]

  # Normalization (ImageNet stats)
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

extractor:
  truncate_at: "layer3"   # layer2=128, layer3=256, layer4=512 dims
  projection_dim: null    # null = sin proyección, int = activa FR-7