wandb:
  project: "bccd-hemograma"
  entity: null          # Tu usuario o equipo en W&B. null = cuenta personal.
  run_name: "yolo-finetune-v1"

detection:
  # Pesos de inicio para fine-tuning (YOLO12s preentrenado en COCO).
  weights: "yolo12s.pt"

  # Ruta al data.yaml generado por Roboflow para BCCD.
  data_yaml: "data/BCCD/data.yaml"

  # Pesos del mejor modelo tras el entrenamiento (para inferencia).
  best_weights: "outputs/yolo_finetune/weights/best.pt"

  # Directorio donde YOLO guarda experimentos.
  output_dir: "outputs"

  # Hiperparámetros de entrenamiento.
  epochs: 50
  imgsz: 640
  batch: 16
  lr0: 0.01

  # Hiperparámetros de inferencia.
  conf_threshold: 0.25
  iou_threshold: 0.45

  # Tamaño uniforme de cada recorte celular (requerido por NFR-6a).
  crop_width: 224
  crop_height: 224

seed: 42