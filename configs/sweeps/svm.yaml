# FR-11 SVM sweep configuration.
# Uses point-config mode in src/experiments/run_svm_experiment.py
# so each W&B run evaluates exactly one SVM configuration.
# Launch with a bounded agent invocation, e.g.:
#   wandb agent --count 30 <entity>/<project>/<sweep_id>

program: src/experiments/cli.py
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --runner
  - svm
method: bayes

metric:
  name: val_macro_f1
  goal: maximize

parameters:
  wandb.enabled:
    value: true

  wandb.project:
    value: bccd-hemograma

  svm.kernel:
    values: ["linear", "rbf"]

  svm.C:
    values: [0.1, 1.0, 10.0, 100.0]

  svm.gamma:
    values: ["scale", 0.01, 0.1, 1.0]
